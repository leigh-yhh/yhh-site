name = "yhh-submit-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Optional: after deploy, attach a custom route in Cloudflare:
# yourhomehunter.com.au/api/submit*

[vars]
# Comma-separated browser origins allowed to call this Worker (CORS).
ALLOWED_ORIGINS = "https://www.yourhomehunter.com.au,https://yourhomehunter.com.au,https://yhh.leigh-8cd.workers.dev,http://127.0.0.1:8787,http://localhost:8787,http://localhost:5500,http://127.0.0.1:5500"

# Set webhook URLs as secrets (not committed):
#   npx wrangler secret put AP_WEBHOOK_WISHLIST
#   npx wrangler secret put AP_WEBHOOK_INTROCALL
#   npx wrangler secret put AP_WEBHOOK_TENANCYAPPLICATION
#   npx wrangler secret put AP_WEBHOOK_TENANCYAPPLICATIONFILES
#   …
# Optional Activepieces header auth (sent as header "Authentication"):
#   npx wrangler secret put AP_WEBHOOK_WISHLIST_AUTH
#   npx wrangler secret put AP_WEBHOOK_TENANCYAPPLICATIONFILES_AUTH
#   …
#
# Local dev: copy .dev.vars.example → .dev.vars and fill values.
