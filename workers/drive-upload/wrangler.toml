name = "yhh-drive-upload"
main = "src/index.js"
compatibility_date = "2026-11-10"

# Optional: after deploy, attach a custom route in Cloudflare:
# yourhomehunter.com.au/api/drive/*

[vars]
# Comma-separated browser origins allowed to call this Worker (CORS).
ALLOWED_ORIGINS = "https://www.yourhomehunter.com.au,https://yourhomehunter.com.au,https://yhh.leigh-8cd.workers.dev,http://127.0.0.1:8787,http://localhost:8787,http://localhost:5500,http://127.0.0.1:5500"

# Google Drive folder that receives per-applicant subfolders.
# Share this folder (or Shared Drive) with the service account as Content Manager / Editor.
# GDRIVE_PARENT_FOLDER_ID = "paste-folder-id-here"

# Optional: Workspace user to impersonate (domain-wide delegation). Leave empty for
# direct service-account access to a shared folder / Shared Drive.
# GDRIVE_IMPERSONATE_USER = "ops@yourhomehunter.com.au"

# Secrets (not committed) — set with wrangler secret put:
#   GOOGLE_SERVICE_ACCOUNT_JSON   full JSON key from Google Cloud
#
# Local: copy .dev.vars.example → .dev.vars

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true
